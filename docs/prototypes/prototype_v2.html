<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NVDA 輝達 財報下載｜10-K、10-Q 季度財務報表與 Excel 下載 · BAMHI 美股財報庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ══ tokens ═════════════════════════════════════════════ */
:root{
  --paper:#F2F3F0;
  --surface:#FFFFFF;
  --ink:#15171A;
  --ink-2:#5C6268;
  --ink-3:#8C9199;
  --rule:#C7CAC5;
  --rule-2:#E3E5E1;
  --green:#0E6B5A;          /* 互動：連結、焦點、選取預覽 */
  --green-wash:#E6EFEC;
  --sig:#C25A18;            /* 唯一保留語意色：10-K 與推算值 */
  --sig-wash:#F7EADF;
  --sig-lite:#F09A5E;       /* 深底上的 10-K */
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans','Noto Sans TC',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.62;
  padding-bottom:64px;-webkit-font-smoothing:antialiased;text-wrap:pretty;
}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(16px,3vw,32px)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* ══ masthead ═══════════════════════════════════════════ */
.masthead{background:var(--surface);border-bottom:1px solid var(--ink);
  position:sticky;top:0;z-index:20}
.masthead .wrap{display:flex;align-items:center;gap:14px;height:54px}
.logo{display:flex;align-items:center;gap:11px;color:var(--ink);text-decoration:none}
.logo .wordmark{height:17px;width:auto;display:block}
.logo .name{font-weight:600;font-size:14px;letter-spacing:.06em;padding-left:11px;
  border-left:1px solid var(--rule)}
.logo .mark{display:grid;grid-template:1fr 1fr/1fr 1fr;gap:1.5px;width:11px;height:11px}
.logo .mark i{background:var(--ink);display:block}
.logo .mark i:last-child{background:var(--sig)}
@media(max-width:560px){.logo .wordmark{height:15px}.logo .name{font-size:12.5px;padding-left:9px}}
.masthead .src{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  margin-left:auto;letter-spacing:.06em;display:flex;align-items:center;gap:7px}
.masthead .src::before{content:'';width:6px;height:6px;background:var(--green)}
.statepeek{display:flex;align-items:center;gap:6px;font-family:var(--mono);
  font-size:10px;color:var(--ink-3);letter-spacing:.06em}
.statepeek select{font-family:var(--mono);font-size:10.5px;color:var(--ink);
  border:1px solid var(--rule);background:var(--surface);padding:3px 5px;border-radius:0}
@media(max-width:820px){.masthead .src{display:none}.statepeek{margin-left:auto}}

/* ══ query ══════════════════════════════════════════════ */
.query{padding:clamp(24px,4vw,38px) 0 24px}
.eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:18px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3)}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--rule-2)}
.tickerline{display:flex;align-items:flex-end;gap:clamp(14px,3vw,28px);flex-wrap:wrap}
.tickerfield{display:flex;flex-direction:column;gap:6px}
.fieldtag{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-3)}
.tickerfield input{
  font-family:var(--mono);font-weight:700;
  font-size:clamp(42px,7.6vw,64px);line-height:1;letter-spacing:-.01em;
  border:0;border-bottom:3px solid var(--ink);background:transparent;
  color:var(--ink);width:5.6ch;padding:0 0 7px;text-transform:uppercase;
}
.tickerfield input:focus{outline:0;border-bottom-color:var(--green)}
.tickerfield input::placeholder{color:var(--rule)}

.resolved{padding-bottom:10px;display:grid;gap:4px}
.resolved .name{font-size:19px;font-weight:600;letter-spacing:.01em}
.resolved .name .tc{font-weight:500;color:var(--ink-2);margin-left:8px}
.resolved .meta{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  display:flex;flex-wrap:wrap;align-items:center;gap:0}
.resolved .meta span{padding-right:10px;margin-right:10px;border-right:1px solid var(--rule-2)}
.resolved .meta span:last-child{border-right:0;margin-right:0;padding-right:0}
.resolved .flag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 6px;border:1px solid var(--ink);color:var(--ink)}

/* ══ workspace ══════════════════════════════════════════ */
.workspace{border-top:1px solid var(--rule);padding-top:26px;
  display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
@media(min-width:1040px){
  .workspace{grid-template-columns:minmax(0,1fr) 320px;gap:0}
  .workspace .gridblock{border-right:1px solid var(--rule);padding-right:34px}
  .workspace .sidecol{padding-left:34px;position:sticky;top:72px;align-self:start}
}
.blockhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.blockhead h2{font-size:14px;font-weight:600;letter-spacing:.02em}
.blockhead .num{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.1em}
.blockhead .hint{font-size:12.5px;color:var(--ink-3)}
.blockhead .count{margin-left:auto;font-family:var(--mono);font-size:11.5px;
  color:var(--ink);letter-spacing:.04em}
.blockhead .count.armed{color:var(--green)}

/* ══ 季度矩陣 ═══════════════════════════════════════════ */
.qgrid{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));
  gap:1px;background:var(--rule);border:1px solid var(--ink);max-width:640px}
.qgrid>*{background:var(--surface)}
.qgrid .colhead,.qgrid .rowhead{font-family:var(--mono);font-size:10.5px;
  color:var(--ink-2);padding:7px 10px;letter-spacing:.1em}
.qgrid .colhead{text-align:center;background:var(--paper);text-transform:uppercase}
.qgrid .colhead.q4{color:var(--sig)}
.qgrid .rowhead{display:flex;align-items:center;white-space:nowrap;
  background:var(--paper);font-weight:500}
.qgrid .corner{background:var(--paper);font-family:var(--mono);font-size:9px;
  color:var(--ink-3);padding:7px 10px;letter-spacing:.06em}
.cell{position:relative;background:var(--surface);border:0;
  padding:12px 6px 11px;font-family:var(--mono);display:flex;
  flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  transition:background .1s ease}
.cell .form{font-size:11.5px;font-weight:700;color:var(--ink)}
.cell .end{font-size:9.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cell:hover:not(.void):not(.on){background:var(--paper)}
.cell:focus-visible{outline:2px solid var(--green);outline-offset:-2px;z-index:2}
.cell.k{box-shadow:inset 0 3px 0 var(--sig)}
.cell.k .form{color:var(--sig)}
.cell.prev{background:var(--green-wash)}
.cell.on{background:var(--ink)}
.cell.on .form{color:#fff}
.cell.on .end{color:rgba(255,255,255,.62)}
.cell.on.k .form{color:var(--sig-lite)}
.cell.anchor{background:var(--green)}
.cell.anchor .form,.cell.anchor .end{color:#fff}
.cell.anchor.k .form{color:#fff}
.cell .edge{position:absolute;top:2px;left:3px;font-size:8px;letter-spacing:.06em;
  color:rgba(255,255,255,.75)}
.cell.void{cursor:not-allowed;background:
  repeating-linear-gradient(-45deg,var(--surface),var(--surface) 5px,var(--rule-2) 5px,var(--rule-2) 6px)}
.cell.void .form{color:var(--rule);font-weight:400}
.cell.void .end{color:var(--ink-3)}

.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;
  font-family:var(--mono);font-size:10.5px;color:var(--ink-3);max-width:640px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:6px;
  vertical-align:-1px;border:1px solid var(--rule)}
.legend i.q{background:var(--surface)}
.legend i.k{background:var(--surface);border-top:3px solid var(--sig)}
.legend i.v{background:repeating-linear-gradient(-45deg,#fff,#fff 3px,var(--rule-2) 3px,var(--rule-2) 4px)}
.legend i.s{background:var(--ink);border-color:var(--ink)}

.note{margin-top:16px;max-width:640px;background:var(--sig-wash);
  border:1px solid #E7C6A6;padding:11px 13px;display:flex;gap:11px;
  font-size:12.5px;line-height:1.6;color:#6E3B12}
.note .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  background:var(--sig);color:#fff;padding:2px 6px;height:fit-content;white-space:nowrap}

/* ══ 側欄摘要 + 動作 ════════════════════════════════════ */
.sidecol h2{font-size:13px;font-weight:600;margin-bottom:12px;
  display:flex;align-items:baseline;gap:10px}
.sidecol h2 .num{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.1em}
.sumlist{border-top:1px solid var(--ink);font-family:var(--mono);font-size:12px}
.sumrow{display:flex;justify-content:space-between;gap:14px;align-items:baseline;
  padding:7px 0;border-bottom:1px solid var(--rule-2)}
.sumrow dt{color:var(--ink-3);font-size:11px;letter-spacing:.04em}
.sumrow dd{font-variant-numeric:tabular-nums;font-weight:500}
.sumrow.total{position:relative;border-bottom:0;border-top:1px solid var(--ink);
  margin-top:3px;padding-top:8px}
.sumrow.total::before{content:'';position:absolute;top:-3px;left:0;right:0;
  height:1px;background:var(--ink)}
.sumrow.total dt{color:var(--ink)}
.sumrow.total dd{font-weight:700}

.actions{display:grid;gap:8px;margin-top:18px}
.btn{font-family:var(--sans);font-size:13.5px;font-weight:500;text-align:left;
  padding:11px 15px;border:1px solid var(--ink);background:var(--ink);color:#fff;
  cursor:pointer;border-radius:0;transition:background .12s,color .12s,border-color .12s}
.btn:hover{background:var(--green);border-color:var(--green)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{background:var(--surface);border-color:var(--ink);color:var(--ink)}
.btn small{display:block;font-family:var(--mono);font-size:10px;opacity:.66;
  font-weight:400;margin-top:2px;letter-spacing:.02em}

/* ══ 財報清單 ═══════════════════════════════════════════ */
.results{margin-top:38px;border-top:1px solid var(--ink);padding-top:18px}
.filings{width:100%;border-collapse:collapse;background:var(--surface);
  border:1px solid var(--rule);font-size:13px}
.filings thead th{font-family:var(--mono);font-size:10px;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:left;
  padding:8px 12px;border-bottom:1px solid var(--ink);background:var(--paper);white-space:nowrap}
.filings tbody td{padding:8px 12px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.filings tbody tr:last-child td{border-bottom:0}
.filings tbody tr:hover{background:var(--paper)}
td.idx,th.idx{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  width:1%;padding-right:0;font-variant-numeric:tabular-nums}
td.per{font-family:var(--mono);font-weight:700;white-space:nowrap;font-size:12.5px}
td.form span{font-family:var(--mono);font-size:10.5px;padding:2px 6px;
  border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
td.form span.k{border-color:var(--sig);color:var(--sig);font-weight:500}
td.date{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);
  white-space:nowrap;font-variant-numeric:tabular-nums}
td.acc{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap}
td.dl{text-align:right;white-space:nowrap}
td.dl a{font-family:var(--mono);font-size:11.5px;color:var(--green);text-decoration:none;
  border-bottom:1px solid transparent}
td.dl a:hover{border-bottom-color:var(--green);color:var(--ink)}
.tablefoot{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}

/* ══ 狀態：載入 / 查無 / 無季報 ═════════════════════════ */
.panel{border:1px solid var(--rule);background:var(--surface);padding:26px clamp(18px,3vw,30px);
  max-width:760px}
.panel .code{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:#fff;background:var(--ink);padding:3px 8px;display:inline-block}
.panel h3{font-size:17px;font-weight:600;margin:14px 0 8px}
.panel h3 .t{font-family:var(--mono);font-weight:700}
.panel p{font-size:13.5px;color:var(--ink-2);max-width:56ch}
.panel .also{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule-2);
  font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.panel .chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:10px}
.panel .chip{background:var(--surface);border:0;text-align:left;cursor:pointer;
  padding:8px 11px;display:grid;gap:1px;font-family:inherit;color:var(--ink)}
.panel .chip:hover{background:var(--ink);color:#fff}
.panel .chip:hover .n{color:rgba(255,255,255,.66)}
.panel .chip .t{font-family:var(--mono);font-weight:700;font-size:12.5px}
.panel .chip .n{font-size:11px;color:var(--ink-3)}
.panel a.out{color:var(--green);font-family:var(--mono);font-size:11.5px}

.skel{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);
  max-width:640px}
.skel div{background:var(--surface);height:38px;position:relative;overflow:hidden}
.skel div::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,var(--rule-2),transparent);
  transform:translateX(-100%);animation:sweep 1.15s ease-in-out infinite}
.skel div:nth-child(2)::after{animation-delay:.1s}
.skel div:nth-child(3)::after{animation-delay:.2s}
.skel div:nth-child(4)::after{animation-delay:.3s}
.skel div:nth-child(5)::after{animation-delay:.4s}
@keyframes sweep{to{transform:translateX(100%)}}
.loadline{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);
  margin-top:12px;display:flex;gap:8px;align-items:center}
.loadline .dots::after{content:'';animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'·'}50%{content:'··'}75%{content:'···'}}

.disclaim{margin-top:44px;padding-top:16px;border-top:1px solid var(--rule);
  font-size:11.5px;color:var(--ink-3);line-height:1.75;max-width:78ch}
.disclaim a{color:var(--green)}
.disclaim a:hover{color:var(--ink)}

/* ══ 窄螢幕 ═════════════════════════════════════════════ */
@media(max-width:760px){
  .filings{border:0;background:transparent}
  .filings thead{position:absolute;left:-9999px}
  .filings tbody tr{display:grid;
    grid-template-columns:auto max-content minmax(0,1fr) auto;
    column-gap:10px;row-gap:3px;background:var(--surface);border:1px solid var(--rule);
    border-bottom-width:0;padding:10px 12px;align-items:center}
  .filings tbody tr:last-child{border-bottom-width:1px}
  .filings tbody td{border:0;padding:0}
  td.idx{grid-column:1;grid-row:1/span 2;align-self:center}
  td.per{grid-column:2;grid-row:1}
  td.form{grid-column:3;grid-row:1;justify-self:start}
  td.date.end{grid-column:2;grid-row:2}
  td.date.filed{grid-column:3;grid-row:2;justify-self:start}
  td.date.filed::before{content:'申報 ';color:var(--ink-3)}
  td.date.end::before{content:'期末 ';color:var(--ink-3)}
  td.acc{display:none}
  td.dl{grid-column:4;grid-row:1/span 2;align-self:center;justify-self:end}
}
@media(max-width:560px){
  .cell{padding:10px 3px 9px}
  .cell .form{font-size:10.5px}
  .cell .end{font-size:8.5px}
  .qgrid .rowhead,.qgrid .corner{padding:7px 7px;font-size:9.5px}
  .resolved .name{font-size:16px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .skel div::after{display:none}
}
</style>
</head>

      <h2>財報清單</h2>
      <span class="hint">依會計期別排序</span>
    </div>
    <table class="filings">
      <thead>
        <tr>
          <th class="idx">#</th><th>會計期別</th><th>表單</th>
          <th>期末日</th><th>申報日</th><th>Accession No.</th><th class="ar"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="tablefoot" id="foot"></p>
  </section>
</template>

<script>
/* ── NVDA 會計年度 1 月結算：FY2024 = 2023/02 ~ 2024/01 ── */
const YEARS=[2023,2024,2025,2026];
const ENDS={
  '2023':['2022-05-01','2022-07-31','2022-10-30','2023-01-29'],
  '2024':['2023-04-30','2023-07-30','2023-10-29','2024-01-28'],
  '2025':['2024-04-28','2024-07-28','2024-10-27','2025-01-26'],
  '2026':['2025-04-27','2025-07-27',null,null]
};
const FILED={
  '2023':['2022-05-27','2022-08-31','2022-11-18','2023-02-24'],
  '2024':['2023-05-26','2023-08-28','2023-11-21','2024-02-21'],
  '2025':['2024-05-29','2024-08-28','2024-11-20','2025-02-26'],
  '2026':['2025-05-28','2025-08-27',null,null]
};
const ACC={
  '2023':['0001045810-22-000147','0001045810-22-000166','0001045810-22-000182','0001045810-23-000017'],
  '2024':['0001045810-23-000091','0001045810-23-000175','0001045810-23-000227','0001045810-24-000029'],
  '2025':['0001045810-24-000124','0001045810-24-000192','0001045810-24-000260','0001045810-25-000023'],
  '2026':['0001045810-25-000108','0001045810-25-000176',null,null]
};
const POPULAR=[['NVDA','輝達'],['AAPL','蘋果'],['MSFT','微軟'],['TSLA','特斯拉']];

let sel=new Set(), anchor=null, hoverIdx=null;
YEARS.forEach(function(y){[0,1,2,3].forEach(function(q){
  if(y>=2024 && ENDS[y][q]) sel.add(y+'-'+q);
});});

const stage=document.getElementById('stage');
let grid,count,hint;

function idx(y,q){return YEARS.indexOf(y)*4+q}
function cellsOf(a,b){
  const out=[];
  for(let i=Math.min(a,b);i<=Math.max(a,b);i++){
    const yy=YEARS[Math.floor(i/4)],qq=i%4;
    if(ENDS[yy][qq]) out.push(yy+'-'+qq);
  }
  return out;
}

function buildGrid(){
  let h='<div class="corner">會計年度</div>';
  ['Q1','Q2','Q3','Q4'].forEach(function(q,i){
    h+='<div class="colhead'+(i===3?' q4':'')+'">'+q+'</div>';
  });
  const list=selList();
  const first=list.length?list[0].key:null, last=list.length?list[list.length-1].key:null;
  const prev=(anchor!==null&&hoverIdx!==null)?cellsOf(anchor,hoverIdx):[];

  YEARS.forEach(function(y){
    h+='<div class="rowhead">FY'+y+'</div>';
    [0,1,2,3].forEach(function(q){
      const end=ENDS[y][q], key=y+'-'+q, isK=(q===3);
      if(!end){
        h+='<div class="cell void" aria-disabled="true"><span class="form">—</span>'+
           '<span class="end">未申報</span></div>';
        return;
      }
      const on=sel.has(key)&&anchor===null;
      const isAnchor=(anchor!==null&&anchor===idx(y,q));
      const cls=['cell',isK?'k':'',on?'on':'',isAnchor?'anchor':'',
                 (!isAnchor&&prev.indexOf(key)>-1)?'prev':''].filter(Boolean).join(' ');
      let edge='';
      if(on&&key===first&&list.length>1) edge='<span class="edge">起</span>';
      if(on&&key===last&&list.length>1) edge='<span class="edge">迄</span>';
      h+='<button class="'+cls+'" data-y="'+y+'" data-q="'+q+'" aria-pressed="'+sel.has(key)+
         '" aria-label="FY'+y+' 第'+(q+1)+'季 '+(isK?'10-K':'10-Q')+' 期末 '+end+'">'+
         edge+'<span class="form">'+(isK?'10-K':'10-Q')+'</span>'+
         '<span class="end">'+end.slice(5).replace('-','/')+'</span></button>';
    });
  });
  grid.innerHTML=h;
}

function selList(){
  const list=[];
  YEARS.forEach(function(y){[0,1,2,3].forEach(function(q){
    if(sel.has(y+'-'+q)) list.push({key:y+'-'+q,y:y,q:q,end:ENDS[y][q],
      filed:FILED[y][q],acc:ACC[y][q],k:q===3});
  });});
  return list;
}

function pick(y,q){
  const key=y+'-'+q;
  if(anchor===null){ sel=new Set([key]); anchor=idx(y,q); }
  else{ sel=new Set(cellsOf(anchor,idx(y,q))); anchor=null; hoverIdx=null; }
  paint();
}

function paint(){
  buildGrid();
  const list=selList();
  count.textContent=anchor!==null?'選取起點已定':'已選 '+list.length+' 季';
  count.className='count'+(anchor!==null?' armed':'');
  hint.textContent=anchor!==null?'再點一格，選到該季為止':'點一格開始、點第二格選到該季';

  const k=list.filter(function(r){return r.k}).length;
  const range=list.length?('FY'+list[0].y+' Q'+(list[0].q+1)+' → FY'+list[list.length-1].y+
              ' Q'+(list[list.length-1].q+1)):'—';
  document.getElementById('sum').innerHTML=
    row('期間',range)+row('季數',list.length+' 季')+
    row('10-Q',(list.length-k)+' 份')+row('10-K',k+' 份',true)+
    '<div class="sumrow total"><dt>檔案總數</dt><dd>'+list.length+'</dd></div>';

  document.getElementById('rows').innerHTML=list.map(function(r,i){
    return '<tr>'+
      '<td class="idx">'+String(i+1).padStart(2,'0')+'</td>'+
      '<td class="per">FY'+r.y+' Q'+(r.q+1)+'</td>'+
      '<td class="form"><span class="'+(r.k?'k':'')+'">'+(r.k?'10-K':'10-Q')+'</span></td>'+
      '<td class="date end">'+r.end+'</td>'+
      '<td class="date filed">'+r.filed+'</td>'+
      '<td class="acc">'+r.acc+'</td>'+
      '<td class="dl"><a href="#">原始檔 ↗</a></td></tr>';
  }).join('');

  document.getElementById('foot').innerHTML=
    '<span>共 '+list.length+' 份</span><span>10-Q '+(list.length-k)+'</span>'+
    '<span>10-K '+k+'</span><span>單次上限 40 季</span>';
}

function row(dt,dd,sig){
  return '<div class="sumrow"><dt>'+dt+'</dt><dd'+(sig?' style="color:var(--sig)"':'')+
         '>'+dd+'</dd></div>';
}

/* ── 狀態切換 ─────────────────────────────────────────── */
const STATES={
  loading:'<div class="skel"><div></div><div></div><div></div><div></div><div></div></div>'+
    '<p class="loadline"><span>讀取 EDGAR 申報索引<span class="dots"></span></span>'+
    '<span style="color:var(--ink-3)">CIK 0001045810 · submissions.json</span></p>',
  notfound:'<div class="panel"><span class="code">查無代號</span>'+
    '<h3>EDGAR 沒有 <span class="t">ZZZZ</span> 的申報紀錄</h3>'+
    '<p>此代號可能已下市、已更名，或從未在美國申報。代號變更後，舊代號的歷史申報仍掛在原公司 CIK 之下。</p>'+
    '<div class="chips">'+POPULAR.map(function(p){
      return '<button class="chip"><span class="t">'+p[0]+'</span><span class="n">'+p[1]+'</span></button>';
    }).join('')+'</div>'+
    '<p class="also">或直接以公司名稱查詢 <a class="out" href="#">EDGAR 全文檢索 ↗</a></p></div>',
  badformat:'<div class="panel"><span class="code">格式錯誤</span>'+
    '<h3>代號僅能包含英文字母與點號</h3>'+
    '<p>長度 1–5 個字元。多層股權的代號以點號分隔，例如 <span class="mono">BRK.A</span>、'+
    '<span class="mono">BF.B</span>。此處不接受空白、數字與連字號。</p>'+
    '<p class="also">目前輸入：<span class="mono" style="color:var(--ink)">NV-D 4</span></p></div>',
  foreign:'<div class="panel"><span class="code">無季報</span>'+
    '<h3><span class="t">TSM</span> 台積電 ADR 是外國發行人</h3>'+
    '<p>外國私人發行人（Foreign Private Issuer）向 SEC 申報 20-F 年報，不申報 10-K 與 10-Q，'+
    '因此沒有季度矩陣可選。台積電的季度數字須改用台灣公開資訊觀測站，或本站的 6-K 附件擷取。</p>'+
    '<p class="also">可用資料：<a class="out" href="#">20-F 年報 4 份 ↗</a>　'+
    '<a class="out" href="#">6-K 季度財務附件 12 份 ↗</a></p></div>'
};

function setState(s){
  if(s==='ok'){
    stage.innerHTML='';
    stage.appendChild(document.getElementById('tpl-ok').content.cloneNode(true));
    grid=document.getElementById('grid');
    count=document.getElementById('count');
    hint=document.getElementById('hint');
    grid.addEventListener('click',function(e){
      const b=e.target.closest('.cell'); if(!b||b.classList.contains('void')) return;
      pick(+b.dataset.y,+b.dataset.q);
    });
    grid.addEventListener('mouseover',function(e){
      if(anchor===null) return;
      const b=e.target.closest('.cell'); if(!b||b.classList.contains('void')) return;
      const n=idx(+b.dataset.y,+b.dataset.q);
      if(n!==hoverIdx){ hoverIdx=n; buildGrid(); }
    });
    grid.addEventListener('mouseleave',function(){
      if(anchor!==null&&hoverIdx!==null){ hoverIdx=null; buildGrid(); }
    });
    paint();
  }else{
    stage.innerHTML='<div class="workspace" style="grid-template-columns:minmax(0,1fr)">'+
                    '<section class="gridblock" style="border-right:0;padding-right:0">'+
                    STATES[s]+'</section></div>';
  }
}

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&anchor!==null){ anchor=null;hoverIdx=null;paint(); }
});
document.getElementById('tk').addEventListener('input',function(e){
  e.target.value=e.target.value.toUpperCase();
});
document.getElementById('peek').addEventListener('change',function(e){
  setState(e.target.value);
});
setState('ok');
</script>
</body>
</html>
